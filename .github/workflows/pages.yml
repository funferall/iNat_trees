name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Pin for reproducible builds. Note (2026-10-19): both 0.18.10 and 0.18.12
  # have been observed to draw nothing on the live page, and a freshly fetched
  # copy of either also draws nothing there, so the blank canvas is NOT a CDN
  # version skew. Keep the pair matched; chase the real cause in tree-display.js
  # / Markmap.create rather than by moving these numbers.
  MARKMAP_VIEW: 0.18.12
  MARKMAP_LIB: 0.18.12

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site into dist/
        run: |
          set -euo pipefail
          mkdir -p dist
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'dist' \
            --exclude 'attached_assets' \
            ./ dist/

      - name: Pin Markmap versions
        run: |
          set -euo pipefail
          # Only the top-level pages use the pinned CDN pair; anything in
          # subfolders (lab/, auth/) is left exactly as committed.
          for f in dist/*.html; do
            [ -f "$f" ] || continue
            grep -q 'cdn.jsdelivr.net/npm/markmap-view' "$f" || continue
            sed -i "s#npm/markmap-view\"#npm/markmap-view@${MARKMAP_VIEW}\"#g" "$f"
            sed -i "s#npm/markmap-lib\"#npm/markmap-lib@${MARKMAP_LIB}\"#g" "$f"
            grep -q "markmap-view@${MARKMAP_VIEW}" "$f" || { echo "::error::markmap-view pin failed for $f"; exit 1; }
            if grep -q 'cdn.jsdelivr.net/npm/markmap-lib"' "$f"; then
              echo "::warning::markmap-lib left unpinned in $f"
            fi
            echo "pinned markmap in $f"
          done

      - name: Inject the theme stylesheets
        run: |
          set -euo pipefail
          for f in index.html landing.html; do
            [ -f "dist/$f" ] || continue
            if grep -q 'theme-app.css' "dist/$f"; then
              echo "theme already present in $f"
            else
              perl -0pi -e 's|</head>|<link rel="stylesheet" href="theme.css">\n<link rel="stylesheet" href="theme-app.css">\n</head>|i' "dist/$f"
            fi
            perl -0pi -e 's|content="#3fac8c"|content="#1f5136"|g' "dist/$f"
            grep -q 'theme-app.css' "dist/$f" || { echo "::error::theme injection failed for $f"; exit 1; }
            echo "theme injected into $f"
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
