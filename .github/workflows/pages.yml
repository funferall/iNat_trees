name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site into dist/
        run: |
          set -euo pipefail
          mkdir -p dist
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'dist' \
            --exclude 'attached_assets' \
            --exclude 'generated-icon.png' \
            ./ dist/

      - name: Inject the theme stylesheets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          THEME = (
              '  <link rel="stylesheet" href="theme.css">\n'
              '  <link rel="stylesheet" href="theme-app.css">\n'
          )

          for name in ('index.html', 'landing.html'):
              p = Path('dist') / name
              if not p.exists():
                  continue
              html = p.read_text(encoding='utf-8')
              if 'theme.css' not in html and '</head>' in html:
                  html = html.replace('</head>', THEME + '</head>', 1)
                  print(f'theme injected into {name}')
              html = html.replace('content="#3fac8c"', 'content="#1f5136"')
              p.write_text(html, encoding='utf-8')
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
