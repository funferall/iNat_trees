name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site into dist/
        run: |
          set -euo pipefail
          mkdir -p dist
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'dist' \
            --exclude 'attached_assets' \
            ./ dist/

      - name: Inject the theme stylesheets
        run: |
          set -euo pipefail
          for f in index.html landing.html; do
            [ -f "dist/$f" ] || continue
            if grep -q 'theme-app.css' "dist/$f"; then
              echo "theme already present in $f"
            else
              perl -0pi -e 's|</head>|<link rel="stylesheet" href="theme.css">\n<link rel="stylesheet" href="theme-app.css">\n</head>|i' "dist/$f"
            fi
            perl -0pi -e 's|content="#3fac8c"|content="#1f5136"|g' "dist/$f"
            grep -q 'theme-app.css' "dist/$f" || { echo "::error::theme injection failed for $f"; exit 1; }
            echo "theme injected into $f"
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
